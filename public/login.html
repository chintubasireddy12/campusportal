<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | NeoPatna Campus Portal</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%); }
    .auth-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .auth-card { background: white; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 440px; box-shadow: 0 25px 50px rgba(0,0,0,0.25); }
    .auth-logo { text-align: center; margin-bottom: 2rem; }
    .auth-logo .logo-icon { width: 64px; height: 64px; background: var(--primary); border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 900; color: var(--accent); margin-bottom: 0.75rem; }
    .auth-logo h1 { font-size: 1.6rem; font-weight: 800; color: var(--primary); }
    .auth-logo p { color: var(--text-muted); font-size: 0.875rem; }
    .divider-or { display: flex; align-items: center; gap: 1rem; color: var(--text-muted); font-size: 0.8rem; margin: 1.25rem 0; }
    .divider-or::before, .divider-or::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .demo-pills { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
    .demo-pill { padding: 0.4rem 0.75rem; border-radius: 20px; font-size: 0.775rem; cursor: pointer; border: 1px solid var(--border); background: var(--bg); transition: all 0.2s; font-weight: 500; }
    .demo-pill:hover { border-color: var(--primary); color: var(--primary); }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="/" class="navbar-brand">
    <div class="logo-icon">NP</div>
    <div class="brand-text">NeoPatna <span>NIT Patna Campus Portal</span></div>
  </a>
</nav>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">NP</div>
      <h1>Welcome Back</h1>
      <p>Sign in to NeoPatna Campus Portal</p>
    </div>

    <div id="alert-box"></div>

    <!-- Demo Accounts -->
    <p style="font-size:0.8rem;font-weight:600;color:var(--text-muted);margin-bottom:0.5rem">🧪 Quick Demo Login:</p>
    <div class="demo-pills">
      <div class="demo-pill" onclick="fillDemo('admin@neopatna.ac.in','Admin@123')">👑 Admin</div>
      <div class="demo-pill" onclick="fillDemo('student@neopatna.ac.in','Test@123')">🎓 Student</div>
      <div class="demo-pill" onclick="fillDemo('faculty@neopatna.ac.in','Test@123')">👨‍🏫 Faculty</div>
    </div>

    <form id="login-form" autocomplete="on">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="Enter your email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position:relative">
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
          <button type="button" onclick="togglePass()" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem" id="pass-toggle">👁️</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem" id="submit-btn">
        Sign In
      </button>
    </form>

    <div class="divider-or">or</div>

    <div style="text-align:center">
      <p style="font-size:0.875rem;color:var(--text-muted)">
        Don't have an account? 
        <a href="/register" style="color:var(--primary-light);font-weight:700">Register here</a>
      </p>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  // Redirect if already logged in
  if (Auth.isLoggedIn()) window.location.href = '/dashboard';

  let showingPass = false;
  function togglePass() {
    showingPass = !showingPass;
    document.getElementById('password').type = showingPass ? 'text' : 'password';
    document.getElementById('pass-toggle').textContent = showingPass ? '🙈' : '👁️';
  }

  function fillDemo(email, pass) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = pass;
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const alertBox = document.getElementById('alert-box');
    alertBox.innerHTML = '';

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="width:1.2rem;height:1.2rem;border-width:2px;display:inline-block;vertical-align:middle"></span> Signing in...';

    try {
      const { ok, data } = await apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email, password })
      });

      if (ok && data.success) {
        Auth.setAuth(data.token, data.user);
        showToast('Login successful! Redirecting...', 'success');
        setTimeout(() => window.location.href = '/dashboard', 1000);
      } else {
        alertBox.innerHTML = `<div class="alert alert-error">❌ ${data.message || 'Invalid credentials'}</div>`;
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
      }
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">❌ Login failed. Please try again.</div>`;
      btn.disabled = false;
      btn.innerHTML = 'Sign In';
    }
  });
</script>
</body>
</html>
